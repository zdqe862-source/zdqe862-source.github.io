<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090a0c">
  <meta name="description" content="">
  <title></title>
  <style>
    :root { color-scheme: dark; background: #090a0c; }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #090a0c;
    }
    body {
      min-height: 100svh;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 48%, rgba(34, 38, 45, .22), transparent 58%),
        #090a0c;
    }
  </style>
</head>
<body>
  <audio id="ambient-audio" src="./assets/background.mp3"
         preload="auto" loop playsinline></audio>

  <script>
    (() => {
      const audio = document.getElementById("ambient-audio");
      audio.volume = 0.18;

      // Try immediately. Some browsers (especially iPhone Safari) block
      // audible autoplay until the visitor interacts with the page.
      const tryPlay = () => {
        const result = audio.play();
        if (result && typeof result.catch === "function") {
          result.catch(() => {});
        }
      };

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", tryPlay, { once: true });
      } else {
        tryPlay();
      }

      // No visible player or button: the first normal touch/click/key press
      // starts the music if the browser blocked autoplay.
      const startAfterGesture = () => {
        if (audio.paused) tryPlay();
        window.removeEventListener("pointerdown", startAfterGesture);
        window.removeEventListener("touchstart", startAfterGesture);
        window.removeEventListener("keydown", startAfterGesture);
      };

      window.addEventListener("pointerdown", startAfterGesture, { passive: true });
      window.addEventListener("touchstart", startAfterGesture, { passive: true });
      window.addEventListener("keydown", startAfterGesture);
    })();
  </script>
</body>
</html>
